<!DOCTYPE html>
<html>
<head>
    <title>Payment Successful</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111827;
            color: white;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .container {
            padding: 40px;
        }

        .section {
            background-color: #1f2937;
            max-width: 600px;
            margin: 80px auto;
            padding: 35px;
            border-radius: 10px;
        }

        h1 {
            color: #22c55e;
        }

        p {
            font-size: 18px;
            color: #e5e7eb;
        }

        a {
            display: inline-block;
            margin: 10px;
            padding: 12px 16px;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        a:hover {
            background-color: #1d4ed8;
        }

        .checkmark {
            font-size: 60px;
            color: #22c55e;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="section">
        <h1>Payment Successful</h1>

        <p>Your payment has been processed.</p>
        <p>A receipt has been sent to your email.</p>

        <p id="waitTime"></p>
        <p id="pickupTime"></p>

        <a href="/">Back to menu</a>
    </div>
</div>

<script>
    function calculatePickupTime() {
        const cart = JSON.parse(localStorage.getItem("cart")) || [];

        let totalItems = 0;

        for (let i = 0; i < cart.length; i++) {
            totalItems += cart[i].quantity || 1;
        }

        let prepMinutes;

        if (totalItems <= 3) {
            prepMinutes = 15;
        } else if (totalItems <= 6) {
            prepMinutes = 25;
        } else if (totalItems <= 10) {
            prepMinutes = 35;
        } else {
            prepMinutes = 50;
        }

        const pickupTime = new Date();
        pickupTime.setMinutes(pickupTime.getMinutes() + prepMinutes);

        return {
            prepMinutes: prepMinutes,
            pickupTime: pickupTime.toLocaleTimeString([], {
                hour: "numeric",
                minute: "2-digit"
            })
        };
    }

    const estimate = calculatePickupTime();

    document.getElementById("waitTime").textContent =
        "Estimated wait time: " + estimate.prepMinutes + " minutes";

    document.getElementById("pickupTime").textContent =
        "Estimated pickup time: " + estimate.pickupTime;

    localStorage.removeItem("cart");
</script>




</body>
</html>
