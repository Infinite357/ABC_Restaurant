<!DOCTYPE html>
<html>
<head>
    <title>Payment Successful</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111827;
            color: white;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .container {
            padding: 40px;
        }

        .section {
            background-color: #1f2937;
            max-width: 600px;
            margin: 80px auto;
            padding: 35px;
            border-radius: 10px;
        }

        h1 {
            color: #22c55e;
        }

        p {
            font-size: 18px;
            color: #e5e7eb;
        }

        a {
            display: inline-block;
            margin: 10px;
            padding: 12px 16px;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        a:hover {
            background-color: #1d4ed8;
        }

        .checkmark {
            font-size: 60px;
            color: #22c55e;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="section">
        <h1>Payment Successful</h1>

        <p>Your payment has been processed.</p>
        <p>A receipt has been sent to your email.</p>

        <p id="waitTime"></p>
        <p id="pickupTime"></p>

        <a href="/">Back to menu</a>
    </div>
</div>

<script>
    const cart = JSON.parse(localStorage.getItem("cart")) || [];

    let totalQuantity = 0;

    for (let i = 0; i < cart.length; i++) {
        totalQuantity += cart[i].quantity;
    }

    const baseWaitTime = 15;
    const minutesPerItem = 5;

    const waitMinutes = baseWaitTime + (totalQuantity * minutesPerItem);

    const pickupDate = new Date();
    pickupDate.setMinutes(pickupDate.getMinutes() + waitMinutes);

    const formattedPickupTime = pickupDate.toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit"
    });

    document.getElementById("waitTime").textContent =
        "Estimated wait time: " + waitMinutes + " minutes";

    document.getElementById("pickupTime").textContent =
        "Estimated pickup time: " + formattedPickupTime;

    localStorage.removeItem("cart");
</script>




</body>
</html>
