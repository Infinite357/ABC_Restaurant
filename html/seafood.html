<!DOCTYPE html>
<html>

<head>
    <title>ABC restaurant</title>
    <link rel="icon" href="/images/RestrauntLogo.png" type="image/png">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111827;
            color: white;
            margin: 0;
            padding: 0;
        }

        .food-img {
            display: block;
            width: 200px;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            margin: 8px auto 0 auto;
        }

        .food-card {
            display: inline-block;
            vertical-align: top;
            margin: 12px 12px;
            text-align: center;
            background-color: #111827;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 12px;
            width: 200px;
            transition: transform 0.2s;
        }

        .food-card:hover {
            transform: translateY(-4px);
            border-color: #60a5fa;
        }

        .food-card-name {
            font-weight: bold;
            color: #e5e7eb;
            margin: 8px 0 4px 0;
            font-size: 14px;
        }

        .food-card-details {
            color: #9ca3af;
            font-size: 12px;
            margin: 4px 0;
        }

        .food-card-price {
            color: #60a5fa;
            font-weight: bold;
            font-size: 14px;
            margin: 8px 0;
        }

        .food-card button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            width: 100%;
            margin-top: 8px;
        }

        .food-card button:hover {
            background-color: #1d4ed8;
        }

        header {
            background-color: #1f2937;
            padding: 30px;
            text-align: center;
        }

        .container {
            padding: 30px;
        }

        #cartMessage {
            color: #22c55e;
            font-weight: bold;
            min-height: 24px;
        }

        .section {
            background-color: #1f2937;
            margin-bottom: 25px;
            padding: 20px;
            border-radius: 10px;
        }

        h2 {
            color: #60a5fa;
        }

        a {
            display: inline-block;
            margin: 8px;
            padding: 12px 16px;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        a:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>

<body>
    <div class="section">
        <table width="100%">
            <tr>
                <td style="width:120px;">
            <img src="/images/RestrauntLogo.png" alt="RestrauntLogo" width="150">
                </td>           
            <td align="left">
                <h2 style="font-family: cursive; font-size:50px;">ABC Restaurant</h2>
                </td>
            </tr>
        </table>

    </div>
    <div class="section">
        <div id="seafood-menu" style="text-align: center;"></div>
    </div>

    <div class = "section">
    <div style = "text-align: center;">
        <a href="/">Main Menu</a>
    </div>
    </div>

    <script>
        async function loadMenuItems() {
            try {
                const response = await fetch('/menu.json');
                const menu = await response.json();

                const menuData = menu.items;
                const proteinContainer = document.getElementById('seafood-menu');
                const proteinItems = menuData.filter(item => item.id.startsWith('SEA'));

                proteinContainer.innerHTML = proteinItems.map(item => `
                    <div class="food-card">
                        <img src="${item.image}" alt="${item.name}" class="food-img">
                        <div class="food-card-name">${item.name}</div>
                        <div class="food-card-details">${item.calories} cal</div>
                        <div class="food-card-price">$${item.price.toFixed(2)}</div>
                        <button onclick="addToCart('${item.id}')">Add to Cart</button>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading menu:', error);
            }
        }

        function addToCart(itemId) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            fetch('/menu.json')
                .then(response => response.json())
                .then(menu => {
                    const item = menu.items.find(i => i.id === itemId);
                    if (!item) {
                        alert('Item not found');
                        return;
                    }

                    const cartItem = cart.find(i => i.id === item.id);
                    if (cartItem) {
                        cartItem.quantity += 1;
                    } else {
                        cart.push({
                            id: item.id,
                            name: item.name,
                            price: item.price,
                            calories: item.calories,
                            image: item.image,
                            quantity: 1
                        });
                    }

                    localStorage.setItem('cart', JSON.stringify(cart));
                    alert(item.name + ' added to cart!');
                })
                .catch(error => {
                    console.error('Error adding to cart:', error);
                });
        }

        document.addEventListener('DOMContentLoaded', loadMenuItems);
    </script>
</body>

</html>
