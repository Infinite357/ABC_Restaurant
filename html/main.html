<!DOCTYPE html>
<html>

<head>
  <title>ABC Restaurant Dashboard</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #111827;
      color: white;
      margin: 0;
      padding: 0;
    }

    .food-card {
      display: inline-block;
      vertical-align: top;
      margin: 0 8px;
      text-align: center;
    }

    .food-img {
      display: block;
      width: 220px;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
      margin: 8px auto 0 auto;
    }

    .food-card {
      display: inline-block;
      vertical-align: top;
      margin: 12px 8px;
      text-align: center;
      background-color: #111827;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 12px;
      width: 200px;
      transition: transform 0.2s;
    }

    .food-card:hover {
      transform: translateY(-4px);
      border-color: #60a5fa;
    }

    .food-card-name {
      font-weight: bold;
      color: #e5e7eb;
      margin: 8px 0 4px 0;
      font-size: 14px;
    }

    .food-card-details {
      color: #9ca3af;
      font-size: 12px;
      margin: 4px 0;
    }

    .food-card-price {
      color: #60a5fa;
      font-weight: bold;
      font-size: 14px;
      margin: 8px 0;
    }

    .food-card button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      width: 100%;
      margin-top: 8px;
    }

    .food-card button:hover {
      background-color: #1d4ed8;
    }

    header {
      background-color: #1f2937;
      padding: 30px;
      text-align: center;
    }

    .container {
      padding: 30px;
    }

    .section {
      background-color: #1f2937;
      margin-bottom: 25px;
      padding: 20px;
      border-radius: 10px;
    }

    h2 {
      color: #60a5fa;
    }

    a {
      display: inline-block;
      margin: 8px;
      padding: 12px 16px;
      background-color: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }

    a:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="section">
      <h2>Search Menu</h2>

      <form action="/search" method="GET">
        <label for="food"></label>

        <input id="food" name="item" type="text" placeholder="Search for food..." />

        <input type="submit" value="Search" />
      </form>
    </div>

    <div class="section">
      <h2>Search Options</h2>
      <a href="cart">View Cart</a>
      <a href="http://localhost:3000/payment">Fast Checkout</a>
      <a href="#">B</a>
    </div>

    <div class="section">
      <h2>Entrees</h2>
      <div id="entrees-menu"></div>
    </div>

    <div class="section">
      <h2>Sides</h2>
      <div id="sides-menu"></div>
    </div>

  </div>

  <script>
    async function loadMenuItems() {
      try {
        const response = await fetch('/menu.json');
        const menu = await response.json();

        // Render Entrees
        const entreesContainer = document.getElementById('entrees-menu');
        const entrees = menu.items.filter(item => item.type === 'entree');
        entreesContainer.innerHTML = entrees.map(item => `
        <div class="food-card">
          <img src="${item.image}" alt="${item.name}" class="food-img">
          <div class="food-card-name">${item.name}</div>
          <div class="food-card-details">${item.calories} cal</div>
          <div class="food-card-price">$${item.price.toFixed(2)}</div>
          <button onclick="addToCart('${item.id}', '${item.name}')">Add to Cart</button>
        </div>
      `).join('');

        // Render Sides
        const sidesContainer = document.getElementById('sides-menu');
        const sides = menu.items.filter(item => item.type === 'side');
        sidesContainer.innerHTML = sides.map(item => `
        <div class="food-card">
          <img src="${item.image}" alt="${item.name}" class="food-img">
          <div class="food-card-name">${item.name}</div>
          <div class="food-card-details">${item.calories} cal</div>
          <div class="food-card-price">$${item.price.toFixed(2)}</div>
          <button onclick="addToCart('${item.id}', '${item.name}')">Add to Cart</button>
        </div>
      `).join('');
      } catch (error) {
        console.error('Error loading menu:', error);
      }
    }

    function addToCart(itemId, itemName) {
      console.log(`Added ${itemName} to cart`);
      alert(`${itemName} added to cart!`);
      // You can integrate this with your cart logic here
    }

    // Load menu when page loads
    document.addEventListener('DOMContentLoaded', loadMenuItems);
  </script>

</body>

</html>
