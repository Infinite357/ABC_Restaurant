<!DOCTYPE html>
<html>

<head>
  <title>ABC Restaurant Dashboard</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #111827;
      color: white;
      margin: 0;
      padding: 0;
    }

    .food-card {
      display: inline-block;
      vertical-align: top;
      margin: 0 8px;
      text-align: center;
    }

    .food-img {
      display: block;
      width: 220px;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
      margin: 8px auto 0 auto;
    }

    .food-card {
      display: inline-block;
      vertical-align: top;
      margin: 12px 8px;
      text-align: center;
      background-color: #111827;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 12px;
      width: 200px;
      transition: transform 0.2s;
    }

    .food-card:hover {
      transform: translateY(-4px);
      border-color: #60a5fa;
    }

    .food-card-name {
      font-weight: bold;
      color: #e5e7eb;
      margin: 8px 0 4px 0;
      font-size: 14px;
    }

    .food-card-details {
      color: #9ca3af;
      font-size: 12px;
      margin: 4px 0;
    }

    .food-card-price {
      color: #60a5fa;
      font-weight: bold;
      font-size: 14px;
      margin: 8px 0;
    }

    .food-card button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      width: 100%;
      margin-top: 8px;
    }

    .food-card button:hover {
      background-color: #1d4ed8;
    }

    header {
      background-color: #1f2937;
      padding: 30px;
      text-align: center;
    }

    .container {
      padding: 30px;
    }

    #cartMessage {
      color: #22c55e;
      font-weight: bold;
      min-height: 24px;
    }

    .section {
      background-color: #1f2937;
      margin-bottom: 25px;
      padding: 20px;
      border-radius: 10px;
    }

    h2 {
      color: #60a5fa;
    }

    a {
      display: inline-block;
      margin: 8px;
      padding: 12px 16px;
      background-color: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }

    a:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>

<body>

  <div class="container">

    <p id="cartMessage"></p>

    <div class="section">
      <h2>Search Menu</h2>

      <form action="/search" method="GET">
        <label for="food"></label>

        <input id="food" name="item" type="text" placeholder="Search for food..." />

        <input type="submit" value="Search" />
      </form>
    </div>

    <div class="section">
      <h2>Quick Navigation</h2>
      <a href="cart">View Cart</a>
      <a href="http://localhost:3000/payment">Fast Checkout</a>
    </div>

    <div class="section">
      <h2>Entrees</h2>
      <div id="entrees-menu"></div>
    </div>

    <div class="section">
      <h2>Sides</h2>
      <div id="sides-menu"></div>
    </div>

  </div>

  <script>
    let menuData = [];

    async function loadMenuItems() {
      try {
        const response = await fetch('/menu.json');
        const menu = await response.json();

        menuData = menu.items;

        const entreesContainer = document.getElementById('entrees-menu');
        const entrees = menuData.filter(item => item.type === 'entree');

        entreesContainer.innerHTML = entrees.map(item => `
        <div class="food-card">
          <img src="${item.image}" alt="${item.name}" class="food-img">
          <div class="food-card-name">${item.name}</div>
          <div class="food-card-details">${item.calories} cal</div>
          <div class="food-card-price">$${item.price.toFixed(2)}</div>
          <button onclick="addToCart('${item.id}')">Add to Cart</button>
        </div>
      `).join('');

        const sidesContainer = document.getElementById('sides-menu');
        const sides = menuData.filter(item => item.type === 'side');

        sidesContainer.innerHTML = sides.map(item => `
        <div class="food-card">
          <img src="${item.image}" alt="${item.name}" class="food-img">
          <div class="food-card-name">${item.name}</div>
          <div class="food-card-details">${item.calories} cal</div>
          <div class="food-card-price">$${item.price.toFixed(2)}</div>
          <button onclick="addToCart('${item.id}')">Add to Cart</button>
        </div>
      `).join('');

        console.log("Menu data loaded:", menuData);

      } catch (error) {
        console.error('Error loading menu:', error);
      }
    }

    function addToCart(itemId) {
      let cart = JSON.parse(localStorage.getItem("cart")) || [];

      const item = menuData.find(function(menuItem) {
        return String(menuItem.id) === String(itemId);
      });

      if (!item) {
        console.log("Item not found:", itemId);
        alert("Item could not be added.");
        return;
      }

      const cartItem = cart.find(function(existingItem) {
        return String(existingItem.id) === String(item.id);
      });

      if (cartItem) {
        cartItem.quantity++;
      } else {
        cart.push({
          id: item.id,
          name: item.name,
          price: item.price,
          calories: item.calories,
          image: item.image,
          quantity: 1
        });
      }

      localStorage.setItem("cart", JSON.stringify(cart));

      console.log("Cart is now:", cart);

      const cartMessage = document.getElementById("cartMessage");

      cartMessage.textContent = item.name + " added to cart!";

      setTimeout(function() {
        cartMessage.textContent = "";
      }, 2000);
    }

    document.addEventListener('DOMContentLoaded', loadMenuItems);
  </script>

</body>

</html>
