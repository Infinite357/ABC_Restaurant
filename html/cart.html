<!DOCTYPE html>
<html>
<head>
  <title>Restaurant Cart</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #111827;
      color: white;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    header {
      background-color: #1f2937;
      padding: 30px;
      text-align: center;
    }

    .container {
      padding: 30px;
    }

    .section {
      background-color: #1f2937;
      margin-bottom: 25px;
      padding: 20px;
      border-radius: 10px;
    }

    .cart-item {
      max-width: 350px;
      margin: 20px auto;
    }

    .cart-img {
      width: 220px;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    #cart {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }

    .cart-item {
      background-color: #111827;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 15px;
      width: 220px;
      text-align: center;
    }

    .cart-img {
      width: 200px;
      height: 130px;
      object-fit: cover;
      border-radius: 8px;
    }

    .link-button {
      display: inline-block;
      text-decoration: none;
    }

    h2 {
      color: #60a5fa;
    }

    a {
      display: inline-block;
      margin: 8px;
      padding: 12px 16px;
      background-color: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }

    a:hover {
      background-color: #1d4ed8;
    }

    .input-row label {
      width: 140px;
      font-weight: bold;
    }

    .input-row input {
      width: 260px;
      padding: 12px;
      border-radius: 6px;
      border: none;
      font-size: 16px;
    }

    .submit-button {
      padding: 12px 18px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .submit-button:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>

<body>


<h1> Cart</h1>

<div id="cart"></div>

<h2 id="subtotal"></h2>
<h2 id="calories"></h2>

<a class="submit-button link-button" href="/">Add more items to cart</a>

<button class="submit-button" onclick="clearCart()">Clear Cart</button>

<a class="submit-button link-button" href="/payment">Checkout</a>

<script src="/js/cart.js"></script>
