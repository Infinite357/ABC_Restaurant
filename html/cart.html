<!DOCTYPE html>
<html>
<head>
  <title>Restaurant Cart</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #111827;
      color: white;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    header {
      background-color: #1f2937;
      padding: 30px;
      text-align: center;
    }

    .container {
      padding: 30px;
    }

    .section {
      background-color: #1f2937;
      margin-bottom: 25px;
      padding: 20px;
      border-radius: 10px;
    }

    .cart-img {
      width: 220px;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    #cart {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }

    .cart-item {
      background-color: #111827;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 15px;
      width: 1000px;
    }

    .cart-img {
      width: 200px;
      height: 130px;
      object-fit: cover;
      border-radius: 8px;
    }

    .link-button {
      display: inline-block;
      text-decoration: none;
    }

    h2 {
      color: #60a5fa;
    }

    a {
      display: inline-block;
      margin: 8px;
      padding: 12px 16px;
      background-color: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }

    a:hover {
      background-color: #1d4ed8;
    }

    .input-row label {
      width: 140px;
      font-weight: bold;
    }

    .input-row input {
      width: 260px;
      padding: 12px;
      border-radius: 6px;
      border: none;
      font-size: 16px;
    }

    .submit-button {
      padding: 12px 18px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }

    .submit-button:hover {
      background-color: #1d4ed8;
    }

    .restrauntHeadingTable{
      margin: auto;
    }
    .cartHeaingTable{
      margin: auto;
      width: 1000px;
    }
    .infoTableBorder{
      width: 1000px;
      margin: auto;
      background-color: #111827;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 15px;
      width: 1000px;
    }

    .infoTableBorder td{
      
      padding: 0px 150px;
      white-space: nowrap;
    }

  </style>
</head>

<body>

<table class="restrauntHeadingTable">
  <tr>
    <td align="right">
      <img src="/images/RestrauntLogo.png" alt="RestrauntLogo" width="150">
    </td>
    <td>
      <h2 style="font-family: cursive; font-size: 50px;">ABC Restraunt</h2>
    </td>
  </tr>
</table>

<table class="cartHeaingTable">
  <tr>
    <td align="left">
      <h1> Cart</h1>
    </td>
    <td>
      <img src="/images/CartLogo.png" alt="RestrauntLogo" width="150">
    </td>
    <td style="width: 30%;">

    </td>
    <td style="width:50%" align="right">
      <a class="submit-button link-button" href="/">+ Add more items</a>
    </td>
  </tr>
</table>


<div id="cart"></div>



<table class="infoTableBorder">
  
  <tr>
    <td align="left">
      <h2>Total Calories:</h2>
    </td>
    <td align="right">
      <h2 id="calories"></h2>
    </td>
  </tr>
  
  <tr>
    <td align="left">
      <h2>Subtotal:</h2>
    </td>
    <td align="right">
      <h2 id="subtotal"></h2>
    </td>
  </tr>
 
  <tr>
    <td align="left">
      <h2>Tax:</h2>
    </td>
    <td align="right">
      <h2 id="tax"></h2>
    </td>
  </tr>

  <tr>
    <td align="left">
      <h2>Total:</h2>
    </td>
    <td align="right">
      <h2 id="total"></h2>
    </td>
  </tr>

</table>




<button class="submit-button" onclick="clearCart()">Clear Cart</button>

<a class="submit-button link-button" href="/payment">Checkout</a>

<script src="/js/cart.js"></script>
