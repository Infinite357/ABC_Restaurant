<!DOCTYPE html>
<html>
<head>
  <title>Restaurant Payment Page</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #111827;
      color: white;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    header {
      background-color: #1f2937;
      padding: 30px;
      text-align: center;
    }

    .container {
      padding: 30px;
    }

    .section {
      background-color: #1f2937;
      margin-bottom: 25px;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }

    h2 {
      color: #60a5fa;
    }

    a {
      display: inline-block;
      margin: 8px;
      padding: 12px 16px;
      background-color: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      text-align: center;
    }

    a:hover {
      background-color: #1d4ed8;
    }

    .payment-form {
      margin: 15px auto;
      max-width: 450px;
    }

    .input-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 15px;
    }

    .input-row label {
      width: 140px;
      font-weight: bold;
      text-align: right;
    }

    .input-row input {
      width: 260px;
      padding: 12px;
      border-radius: 6px;
      border: none;
      font-size: 16px;
      text-align: left;
    }

    .card-preview {
      margin-top: 15px;
    }

    #cardImage {
      display: none;
      width: 140px;
      height: auto;
      margin: 8px auto 0 auto;
      border-radius: 6px;
    }

    .submit-button {
      padding: 12px 18px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
    }

    .submit-button:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>

<body>

<!-- Payment summary section.
     The server replaces PAYMENT_SUMMARY with placeholder elements.
     Browser JavaScript fills those elements using the cart from localStorage. -->
<div class="section">
  <h2>Payment Summary</h2>

  <!-- PAYMENT_SUMMARY -->

</div>

<div class="section">
  <h2>Payment Information</h2>

  <!-- Payment form sends payment information to the server using POST.
       POST keeps payment data out of the URL. -->
  <form action="/validate-payment" method="POST" class="payment-form">

    <!-- Hidden input used to send cart data to the server.
         The server cannot directly access browser localStorage,
         so JavaScript copies the cart into this field before submission. -->
    <input type="hidden" id="cartData" name="cartData">

    <!-- Card number input.
         inputmode and pattern help the browser prefer numeric input,
         but server-side validation still performs the real validation. -->
    <div class="input-row">
      <label for="cardNumber">Card Number:</label>
      <input
              type="text"
              id="cardNumber"
              name="cardNumber"
              placeholder="Enter card number"
              maxlength="16"
              inputmode="numeric"
              pattern="[0-9]*"
              required
      />
    </div>

    <!-- Displays detected card type and card image preview. -->
    <div class="card-preview">
      <p id="cardTypeText">Card type: Unknown</p>
      <img id="cardImage" src="" alt="Card type preview">
    </div>

    <!-- Expiration date input.
         paymentCheckout.js can format values like 1230 into 12/30. -->
    <div class="input-row">
      <label for="expiration">Expiration:</label>
      <input
              id="expiration"
              name="expiration"
              type="text"
              placeholder="MM/YY"
              maxlength="5"
              required
      />
    </div>

    <!-- CVV input. -->
    <div class="input-row">
      <label for="cvv">CVV:</label>
      <input
              id="cvv"
              name="cvv"
              type="text"
              placeholder="123"
              maxlength="4"
              inputmode="numeric"
              pattern="[0-9]*"
              required
      />
    </div>

    <!-- Email address used for the receipt email. -->
    <div class="input-row">
      <label for="email">Email Address</label>
      <input
              type="email"
              id="email"
              name="email"
              placeholder="customer@example.com"
              maxlength="100"
              required
      >
    </div>

    <input
            type="submit"
            value="Validate Payment"
            class="submit-button"
    />

  </form>
</div>

<!-- External JavaScript for extra payment page behavior,
     such as expiration date formatting and pickup estimate display. -->
<script src="/js/paymentCheckout.js"></script>

<script>
  // Get references to card input and card preview elements.
  const cardInput = document.getElementById("cardNumber");
  const cardTypeText = document.getElementById("cardTypeText");
  const cardImage = document.getElementById("cardImage");

  // Runs every time the user types in the card number field.
  cardInput.addEventListener("input", function() {
    // Remove anything that is not a digit.
    let cardNumber = cardInput.value.replace(/\D/g, "");

    // Limit card number to 16 digits.
    if (cardNumber.length > 16) {
      cardNumber = cardNumber.substring(0, 16);
    }

    // Put the cleaned card number back into the input box.
    cardInput.value = cardNumber;

    // Detect card type based on the starting digits.
    // Then update the card type text and card image preview.
    if (cardNumber.startsWith("4")) {
      cardTypeText.textContent = "Card type: Visa";
      cardImage.src = "/images/visa.png";
      cardImage.style.display = "block";
    }
    else if (cardNumber.startsWith("2") || cardNumber.startsWith("5")) {
      cardTypeText.textContent = "Card type: Mastercard";
      cardImage.src = "/images/mastercard.png";
      cardImage.style.display = "block";
    }
    else if (cardNumber.startsWith("34") || cardNumber.startsWith("37")) {
      cardTypeText.textContent = "Card type: American Express";
      cardImage.src = "/images/amex.png";
      cardImage.style.display = "block";
    }
    else if (cardNumber.startsWith("6")) {
      cardTypeText.textContent = "Card type: Discover";
      cardImage.src = "/images/discover.png";
      cardImage.style.display = "block";
    }
    else {
      cardTypeText.textContent = "Card type: Unknown";
      cardImage.src = "";
      cardImage.style.display = "none";
    }
  });

  // Reads cart data from localStorage and updates the payment summary.
  function updatePaymentSummary() {
    const cart = JSON.parse(localStorage.getItem("cart")) || [];

    let subtotal = 0;

    // Calculate subtotal from price * quantity for every cart item.
    for (let i = 0; i < cart.length; i++) {
      subtotal += cart[i].price * cart[i].quantity;
    }

    // Calculate tax and final total.
    const taxRate = 0.08875;
    const tax = subtotal * taxRate;
    const total = subtotal + tax;

    // Display subtotal, tax, and total on the payment page.
    document.getElementById("paymentSubtotal").textContent =
            "Subtotal: $" + subtotal.toFixed(2);

    document.getElementById("paymentTax").textContent =
            "Tax: $" + tax.toFixed(2);

    document.getElementById("paymentTotal").textContent =
            "Total: $" + total.toFixed(2);
  }

  // Get the payment form.
  const paymentForm = document.querySelector(".payment-form");

  // Before submitting the form, copy the cart from localStorage into cartData.
  // This allows index.js to receive the cart with the rest of the form data.
  paymentForm.addEventListener("submit", function() {
    document.getElementById("cartData").value =
            localStorage.getItem("cart") || "[]";
  });

  // Update payment summary when the payment page first loads.
  updatePaymentSummary();
</script>

</body>
</html>
